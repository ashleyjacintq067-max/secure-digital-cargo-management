{% extends "base.html" %}{% block title %}Reports{% endblock %}{% block content %}<div class="heading"><h1>Cargo reports</h1><a class="primary" href="{{ url_for('reports.export') }}">Export CSV</a></div><section class="panel"><table><tr><th>Status</th><th>Records</th><th>Total quantity</th></tr>{% for r in rows %}<tr><td>{{ r.current_status }}</td><td>{{ r.total }}</td><td>{{ r.quantity or 0 }}</td></tr>{% else %}<tr><td colspan="3">No report data.</td></tr>{% endfor %}</table></section>{% endblock %}
