{% extends "base.html" %}

{% block title %}Add Vessel | SDCMS{% endblock %}

{% block content %}

<div class="page-heading">
    <div>
        <p class="eyebrow">FLEET MANAGEMENT</p>
        <h1>Add Vessel</h1>
        <p class="page-description">Register a new vessel in the system.</p>
    </div>
</div>

<form method="post" class="cargo-panel cargo-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="form-section-heading">
        <span>♧</span>
        <div>
            <h2>Vessel details</h2>
            <p>Enter the details of the vessel you want to register.</p>
        </div>
    </div>

    <div class="cargo-form-grid">
        <label>Vessel name
            <input name="vessel_name" placeholder="MV Pwani Star" required>
        </label>

        <label>Identifier (IMO or registration)
            <input name="vessel_identifier" placeholder="DEMO-001">
        </label>

        <label>Flag country
            <input name="flag_country" placeholder="Kenya">
        </label>
    </div>

    <div class="form-actions">
        <a href="{{ url_for('vessels.listing') }}" style="color:#64748B;text-decoration:none;font-size:12px;">Cancel</a>
        <button type="submit" class="primary">Save vessel</button>
    </div>
</form>

{% endblock %}
